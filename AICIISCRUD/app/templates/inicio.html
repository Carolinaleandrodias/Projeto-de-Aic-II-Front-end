<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C3 Agendamentos</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Adicionando o estilo da página */
        body {
            display: flex;
            font-family: "League Spartan", sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        /* Estilo para a barra de navegação à esquerda */
        .navbar-left {
            width: 200px; /* Largura ajustada da navbar */
            height: 100vh;
            background-color: #1c5b9b;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 30px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center; /* Centraliza os itens do menu */
        }

        .navbar-left .navbar-brand {
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 1.5em;
            margin-bottom: 40px;
        }

        .navbar-left .nav-item {
            margin: 15px 0;
        }

        .navbar-left .nav-link {
            color: white;
            font-size: 1.2em !important;;
            font-weight: bold;
            padding: 10px 0;
            display: block;
            transition: background-color 0.3s ease;
        }

        .navbar-left .nav-link:hover {
            background-color: #0A3871;
            border-radius: 5px;
        }

        /* Espaço para o conteúdo principal */
        .main-content {
            margin-left: 200px; /* Ajustando o espaço para a largura reduzida da navbar */
            padding: 40px;
            width: 100%;
        }

        h1 {
            color: #0A3871;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-family: "League Spartan", sans-serif;
        }
    </style>
</head>
<body>
    <!-- Barra de Navegação à Esquerda -->
    <div class="navbar-left">
        <a class="navbar-brand">MENU</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="/usuarios/inicio">Inicio</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/usuarios/agenda">Agendamentos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/usuarios/perfil">Perfil</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/logout">Sair</a>
            </li>
        </ul>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="container">
            <h1>Bem-vindo à Tela Inicial</h1>
            <p>Acompanhe ou faça um agendamento de sala.</p>
        </div>
    </div>
</body>
</html>
