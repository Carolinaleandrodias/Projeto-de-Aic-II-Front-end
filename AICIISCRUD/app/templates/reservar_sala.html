<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Reservar Sala</title>
</head>
<body>
    <h1>Reservar Sala</h1>
    <form action="{{ url_for('reservas.reservar_sala') }}" method="POST">
        <label for="sala_id">ID da Sala:</label>
        <input type="number" id="sala_id" name="sala_id" required>

        <label for="usuario">Usuário:</label>
        <input type="text" id="usuario" name="usuario" required>

        <label for="inicio">Início:</label>
        <input type="datetime-local" id="inicio" name="inicio" required>

        <label for="fim">Fim:</label>
        <input type="datetime-local" id="fim" name="fim" required>

        <button type="submit">Reservar</button>
    </form>
</body>
</html>
