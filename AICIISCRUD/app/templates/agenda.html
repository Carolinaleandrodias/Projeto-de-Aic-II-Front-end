<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de salas C3</title>
    <link rel="stylesheet" href="{{url_for('static', filename = 'css/agenda.css')}}">
</head>
<body>
    <div class="container">
        <h1 class="container__titulo__principal">AGENDAMENTOS DE SALAS C3</h1>
        
        <div>
            <button id="buttonBefore" onclick="previousWeek()">SEMANA ANTERIOR</button>
            <span id="weekLabel"></span>         
            <button id="buttonAfter" onclick="nextWeek()">PRÓXIMA SEMANA</button>
            
            <div class="grid" id="scheduleGrid"></div>
        </div>
    </div>
        
    <div class="logo">
        <!-- <img class="logo__C3" src="../image/c3logo.png" alt=""> -->
    </div>
    <script>
        const userEmail = "{{ current_user.email }}";  // Get the logged-in user's email

        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('scheduleGrid');
            for (let i = 0; i < 100; i++) {  // Example: 100 tiles
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.bookedBy = '';  // Initially not booked
                tile.addEventListener('click', function() {
                    if (tile.dataset.bookedBy === '') {
                        tile.style.backgroundColor = 'orange';
                        tile.innerText = userEmail;
                        tile.dataset.bookedBy = userEmail;
                        // Send booking info to the server
                        bookTile(i, userEmail);
                    } else if (tile.dataset.bookedBy === userEmail) {
                        tile.style.backgroundColor = '';
                        tile.innerText = '';
                        tile.dataset.bookedBy = '';
                        // Send unbooking info to the server
                        unbookTile(i);
                    }
                });
                grid.appendChild(tile);
            }
        });

        function bookTile(tileIndex, email) {
            fetch('/book_tile', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tileIndex, email })
            });
        }

        function unbookTile(tileIndex) {
            fetch('/unbook_tile', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tileIndex })
            });
        }
    </script>
    <script src="{{url_for('static', filename = 'js/script.js')}}"></script>
</body>
</html>
