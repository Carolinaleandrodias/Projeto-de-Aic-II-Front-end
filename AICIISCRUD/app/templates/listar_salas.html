<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Salas</title>
</head>
<body>
    <h1>Salas Registradas</h1>
    <ul>
        {% for sala in salas %}
            <li>Sala: {{ sala.nome }} - Disponível: {{ 'Sim' if sala.disponivel else 'Não' }}</li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('main.registrar_sala') }}">Registrar nova sala</a></p>
</body>
</html>
