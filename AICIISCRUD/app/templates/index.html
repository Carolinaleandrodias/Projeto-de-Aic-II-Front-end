<div class="toggle-container">
    <div class="toggle">
        <div class="toggle-panel toggle-left">
            <h1 id="text1">Olá, seja <br/> bem-vindo!</h1>
            <h1 id="text2">Sistema de agendamento de salas</h1>
            <p>Acesse a sua conta agora!</p>
            <form action="{{ url_for('usuarios.login') }}" method="POST">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="senha" placeholder="Senha" required>
                <button type="submit">Login</button>
            </form>
        </div>
        <div class="toggle-panel toggle-right">
            <h1 id="text3">Crie sua conta</h1>
            <form action="{{ url_for('usuarios.register') }}" method="POST">
                <input type="text" name="nome" placeholder="Nome" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="text" name="matricula" placeholder="Matricula" required>
                <input type="password" name="senha" placeholder="Senha" required>
                <input type="password" name="confirm_senha" placeholder="Confirme a Senha" required>
                <button type="submit">Registrar</button>
            </form>
        </div>
    </div>
</div>
