<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de salas C3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <div class="container">
        <h1 class="container__titulo__principal">AGENDAMENTOS DE SALAS C3</h1>
        <div class="group__dates">
            <button id="buttonBefore" onclick="previousWeek()">SEMANA ANTERIOR</button>
            <span id="weekLabel"></span>         
            <button id="buttonAfter" onclick="nextWeek()">PRÓXIMA SEMANA</button>
            <div class="grid" id="scheduleGrid"></div>
        </div>
    </div>

    <!-- Modal do Formulário de Agendamento -->
    <div id="agendamento-form" style="display: none;">
        <h1>Agendamento</h1>
        <form id="agendamentoForm" onsubmit="storeBookingData(event)">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
    
            <label for="data">Data:</label>
            <input type="date" id="data" name="data" required>
    
            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora" required>
    
            <label for="sala">Sala:</label>
            <select id="sala" name="sala" required>
            </select>
    
            <button type="submit">Agendar</button>
        </form>
    </div>
    

    <script src="script.js"></script>
    <script src="formularioAgend.js"></script>
</body>
</html>
